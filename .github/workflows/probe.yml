name: SDK Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Dump ManagedSettingsUI API
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          set +e
          xcrun swift-api-digester -dump-sdk -module ManagedSettingsUI \
            -target arm64-apple-ios15.0 -sdk "$SDK" -o msu.json 2> err.txt
          echo "digester exit: $?"
          echo "=== err (head) ==="; head -20 err.txt
          echo "=== Shield-related decls ==="
          grep -oE '"printedName": "[^"]*[Ss]hield[^"]*"' msu.json | sort -u | head -100
          echo "=== configuration() methods ==="
          grep -oE '"printedName": "configuration[^"]*"' msu.json | sort -u
          echo "=== top-level Class names ==="
          grep -oE '"printedName": "[A-Z][A-Za-z0-9]+", *$' msu.json | sort -u | head -80
