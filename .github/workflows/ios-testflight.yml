name: iOS TestFlight

# Signs TaskLock with your App Store Connect API key (cloud signing — no
# certificates to manage) and uploads it to TestFlight. You then install it
# from the TestFlight app on your iPhone. No Mac required on your end.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_ISSUER_ID   – App Store Connect API key Issuer ID (a UUID)
#   APPSTORE_KEY_ID      – App Store Connect API key ID (e.g. ABC123DEF4)
#   APPSTORE_PRIVATE_KEY – contents of the AuthKey_XXXX.p8 file (paste as-is)
#   APPLE_TEAM_ID        – your 10-char Apple Developer Team ID
#
# One-time setup in App Store Connect before the first run:
#   1. Users and Access → Integrations → App Store Connect API → generate a
#      team key with the "App Manager" role. Note Issuer ID + Key ID, download
#      the .p8 (you can only download it once).
#   2. Apps → + → New App, bundle id com.celikj.tasklock, so a record exists.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (must be higher than the last upload)'
        required: true
        default: '1'

jobs:
  testflight:
    name: Build & upload to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          # Public client SDK keys, injected from repo secrets so they aren't
          # committed. Builds still succeed if unset (features self-disable).
          VITE_REVENUECAT_APPLE_KEY: ${{ secrets.REVENUECAT_APPLE_KEY }}
          VITE_APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Write App Store Connect API key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Set build number
        working-directory: ios/App
        run: |
          BN="${{ github.event.inputs.build_number }}"
          # Every bundle in the .ipa must carry the same CFBundleVersion or
          # the App Store upload validator rejects it — new extensions must be
          # added here.
          for PLIST in App/Info.plist ShieldConfig/Info.plist TaskMonitor/Info.plist TaskLockWidget/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" "$PLIST"
            plutil -p "$PLIST" | grep -i version || true
          done

      - name: Archive (Xcode-managed cloud signing)
        working-directory: ios/App
        run: |
          # First archive of a brand-new extension bundle id often fails with
          # "provisioning profile doesn't match the app-groups entitlement":
          # attempt 1 registers the bundle id with Apple, but the App Group
          # association hasn't propagated into the generated profile yet.
          # Retrying after a pause reliably picks up the corrected profile,
          # so don't treat the first provisioning failure as fatal.
          for attempt in 1 2 3; do
            if xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
              -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
              -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
              DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
              CODE_SIGN_STYLE=Automatic \
              archive; then
              exit 0
            fi
            echo "Archive attempt $attempt failed; retrying in 60s..."
            sleep 60
          done
          echo "Archive failed after 3 attempts." >&2
          exit 65

      - name: Export signed .ipa
        working-directory: ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}
          ls -la "$RUNNER_TEMP/export"

      - name: Verify Family Controls entitlement in the signed .ipa
        run: |
          # App Review rejects Screen Time apps whose *shipped binaries* lack
          # com.apple.developer.family-controls, even when the .entitlements
          # sources and the portal capabilities all look correct — the archive
          # and export steps succeed either way, so this is the only place the
          # real answer is visible. Fail before upload rather than after review.
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          WORK="$RUNNER_TEMP/ipa-check"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$IPA" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name '*.app' | head -1)

          # Bundles that use the Screen Time APIs and so must carry the
          # entitlement. TaskLockWidget is deliberately absent: it only reads
          # shared state from the App Group and needs no Family Controls.
          REQUIRED="$APP $APP/PlugIns/TaskMonitor.appex $APP/PlugIns/ShieldConfig.appex"
          MISSING=0

          for BUNDLE in $REQUIRED; do
            NAME=$(basename "$BUNDLE")
            echo "── $NAME ─────────────────────────────────"
            if [ ! -d "$BUNDLE" ]; then
              echo "  MISSING BUNDLE: $BUNDLE"
              MISSING=1
              continue
            fi

            ENTS=$(codesign -d --entitlements - "$BUNDLE" 2>&1 || true)
            if echo "$ENTS" | grep -q 'com.apple.developer.family-controls'; then
              echo "  entitlement:  present in signature"
            else
              echo "  entitlement:  *** ABSENT from signature ***"
              MISSING=1
            fi

            PROFILE="$BUNDLE/embedded.mobileprovision"
            if [ -f "$PROFILE" ]; then
              DECODED=$(security cms -D -i "$PROFILE" 2>/dev/null || true)
              echo "  profile:      $(echo "$DECODED" | plutil -extract Name raw - 2>/dev/null || echo unknown)"
              if echo "$DECODED" | grep -q 'com.apple.developer.family-controls'; then
                echo "  profile ent:  present"
              else
                echo "  profile ent:  *** ABSENT from provisioning profile ***"
                MISSING=1
              fi
            else
              echo "  profile:      no embedded.mobileprovision"
              MISSING=1
            fi
          done

          echo "──────────────────────────────────────────"
          if [ "$MISSING" -ne 0 ]; then
            echo "Family Controls entitlement is not fully present in the signed" >&2
            echo "binaries — uploading this build would be rejected by App Review." >&2
            exit 1
          fi
          echo "All Screen Time bundles carry the Family Controls entitlement."

      - name: Upload to TestFlight
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey ${{ secrets.APPSTORE_KEY_ID }} \
            --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }}
