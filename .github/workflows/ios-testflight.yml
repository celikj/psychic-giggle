name: iOS TestFlight

# Signs TaskLock with your App Store Connect API key (cloud signing — no
# certificates to manage) and uploads it to TestFlight. You then install it
# from the TestFlight app on your iPhone. No Mac required on your end.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_ISSUER_ID   – App Store Connect API key Issuer ID (a UUID)
#   APPSTORE_KEY_ID      – App Store Connect API key ID (e.g. ABC123DEF4)
#   APPSTORE_PRIVATE_KEY – contents of the AuthKey_XXXX.p8 file (paste as-is)
#   APPLE_TEAM_ID        – your 10-char Apple Developer Team ID
#
# One-time setup in App Store Connect before the first run:
#   1. Users and Access → Integrations → App Store Connect API → generate a
#      team key with the "App Manager" role. Note Issuer ID + Key ID, download
#      the .p8 (you can only download it once).
#   2. Apps → + → New App, bundle id com.celikj.tasklock, so a record exists.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (must be higher than the last upload)'
        required: true
        default: '1'

jobs:
  testflight:
    name: Build & upload to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          # Public client SDK keys, injected from repo secrets so they aren't
          # committed. Builds still succeed if unset (features self-disable).
          VITE_REVENUECAT_APPLE_KEY: ${{ secrets.REVENUECAT_APPLE_KEY }}
          VITE_APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Write App Store Connect API key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Set build number
        working-directory: ios/App
        run: |
          BN="${{ github.event.inputs.build_number }}"
          # Every bundle in the .ipa must carry the same CFBundleVersion or
          # the App Store upload validator rejects it — new extensions must be
          # added here.
          for PLIST in App/Info.plist ShieldConfig/Info.plist TaskMonitor/Info.plist TaskLockWidget/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" "$PLIST"
            plutil -p "$PLIST" | grep -i version || true
          done

      - name: Archive (Xcode-managed cloud signing)
        working-directory: ios/App
        run: |
          # First archive of a brand-new extension bundle id often fails with
          # "provisioning profile doesn't match the app-groups entitlement":
          # attempt 1 registers the bundle id with Apple, but the App Group
          # association hasn't propagated into the generated profile yet.
          # Retrying after a pause reliably picks up the corrected profile,
          # so don't treat the first provisioning failure as fatal.
          for attempt in 1 2 3; do
            if xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
              -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
              -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
              DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
              CODE_SIGN_STYLE=Automatic \
              archive; then
              exit 0
            fi
            echo "Archive attempt $attempt failed; retrying in 60s..."
            sleep 60
          done
          echo "Archive failed after 3 attempts." >&2
          exit 65

      - name: Export signed .ipa
        working-directory: ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          # Same flake the archive step retries for: export fetches a profile per
          # bundle id from Apple, and a dropped connection surfaces as
          # "No profiles for 'com.celikj.tasklock...' were found" right after an
          # "Internet connection appears to be offline" line — which reads like a
          # missing capability but isn't. Retry before believing it.
          for attempt in 1 2 3; do
            if xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -exportPath "$RUNNER_TEMP/export" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
              -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
              -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}; then
              ls -la "$RUNNER_TEMP/export"
              exit 0
            fi
            echo "Export attempt $attempt failed; retrying in 60s..."
            # A partial export directory makes the next attempt fail on its own.
            rm -rf "$RUNNER_TEMP/export"
            sleep 60
          done
          echo "Export failed after 3 attempts." >&2
          exit 70

      # The export re-signs every bundle with whatever the distribution profile
      # grants. If Family Controls isn't enabled on an App ID, the entitlement
      # is silently dropped here and the upload succeeds — App Review is then
      # the first thing to tell you, days later. Check the actual signed
      # binaries instead.
      - name: Verify Family Controls entitlement on the signed .ipa
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          scripts/verify-ipa-entitlements.sh "$IPA"

      - name: Upload to TestFlight
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey ${{ secrets.APPSTORE_KEY_ID }} \
            --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }}
