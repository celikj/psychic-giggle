name: App Store screenshots

# Generates App Store screenshots without Xcode/Simulator — TaskLock is 100%
# web content with no native chrome, so Playwright renders it in headless
# Chromium at exact device pixel dimensions. Runs on ubuntu-latest (Node +
# Chromium only), not macOS, so it costs a couple of minutes at the 1x
# multiplier instead of the 10x macOS rate.
#
# Manual only — screenshots are a release-time artifact, not something to
# regenerate on every push.

on:
  workflow_dispatch:

jobs:
  screenshots:
    name: Capture screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Capture
        run: npm run screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: store-screenshots/
          retention-days: 30
