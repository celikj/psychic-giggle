name: CI

# Runs on every push and pull request: typecheck, Vitest unit tests over the
# pure store logic, a build, and the Playwright e2e suite on the web bundle,
# plus an unsigned iOS compile check so a broken Swift build (plugin,
# ShieldConfig, or TaskMonitor extension) shows up on the PR instead of on
# someone's phone after a TestFlight upload.

on:
  push:
    branches: ['**']
  pull_request:

# A newer push supersedes any still-queued/running CI for the same branch —
# without this, a runner backlog (or a GitHub Actions outage) piles up stale
# runs that all execute eventually, burning macOS minutes for nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, unit tests, build & e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # App Review's automated scan rejects any binary that links a Screen Time
      # framework without the Family Controls entitlement — including an
      # extension that only picked one up through a shared source file. Cheap
      # to check here, expensive to find out from a rejected submission.
      - name: Family Controls entitlement check
        run: npm run check:entitlements

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  ios:
    name: iOS compile check (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build (no signing)
        working-directory: ios/App
        run: |
          # -sdk iphoneos (not the simulator SDK) so FamilyControls/ManagedSettings/
          # DeviceActivity headers are actually available and their code paths get
          # compiled — the simulator SDK doesn't ship those frameworks, which would
          # make this check pass trivially without verifying the Screen Time code.
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
