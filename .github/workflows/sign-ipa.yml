name: Sign IPA

# Re-signs an .ipa with the Apple developer certificate held in repo secrets
# and publishes it for over-the-air install, so a device can be provisioned
# without a Mac, Xcode, or iTunes anywhere in the loop.
#
# Requires three secrets (see the README section "Rotating the signing
# secrets" for how to produce them):
#   IOS_SIGNING_P12_BASE64          base64 of the .p12 (certificate + private key)
#   IOS_SIGNING_P12_PASSWORD        the password that .p12 was exported with
#   IOS_PROVISIONING_PROFILE_BASE64 base64 of the .mobileprovision
#
# The profile decides which devices can install the result: a development or
# ad-hoc profile only covers the UDIDs registered in it.

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct download URL of the IPA to sign (blank = app.ipa from the repo root)'
        required: false
        type: string
      bundle_id:
        description: 'Optional bundle identifier override'
        required: false
        type: string

permissions:
  contents: write

# macOS runners bill at 10x, so never let two of these pile up.
concurrency:
  group: sign-ipa
  cancel-in-progress: false

jobs:
  sign:
    name: Sign and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          if [ -n "$IPA_URL" ]; then
            echo "Downloading the IPA to sign..."
            curl -fsSL --retry 3 --retry-delay 2 -o unsigned.ipa "$IPA_URL"
          elif [ -f app.ipa ]; then
            cp app.ipa unsigned.ipa
          else
            echo "::error::No ipa_url given and no app.ipa in the repo root." >&2
            exit 1
          fi
          # A wrong URL usually yields an HTML error page; catch that here
          # rather than in the middle of codesign.
          if ! unzip -l unsigned.ipa | grep -q 'Payload/'; then
            echo "::error::Downloaded file is not an IPA (no Payload/ directory)." >&2
            exit 1
          fi
          echo "IPA size: $(du -h unsigned.ipa | cut -f1)"

      - name: Apply the bundle identifier override
        if: ${{ inputs.bundle_id != '' }}
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          # Done before signing, on the Info.plist itself, so it applies
          # whichever of the two signing paths below ends up running.
          rm -rf rebundle && mkdir rebundle && cd rebundle
          unzip -qq ../unsigned.ipa
          APP="$(find Payload -maxdepth 1 -name '*.app' | head -1)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          rm -f ../unsigned.ipa
          zip -qry ../unsigned.ipa Payload
          echo "Bundle identifier set to $BUNDLE_ID"

      - name: Create a temporary keychain and import the signing identity
        env:
          P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for required in P12_BASE64 P12_PASSWORD PROFILE_BASE64; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Secret for $required is empty or unset." >&2
              exit 1
            fi
          done

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # Random, one-shot, and masked: it never needs to leave this step,
          # and deleting the keychain later doesn't require it.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # -lut with no -t disables the inactivity lock that would otherwise
          # re-lock the keychain mid-job and fail codesign.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          # Without this, codesign triggers a UI authorisation prompt that a
          # headless runner can never answer, and the job hangs until timeout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null 2>&1
          # Put it on the search list so fastlane and codesign find it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$RUNNER_TEMP/cert.p12"

          # The identity is a certificate fingerprint and common name, not a
          # secret; both are printed by codesign on any signed binary anyway.
          IDENTITY_LINE="$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1)"
          if [ -z "$IDENTITY_LINE" ]; then
            echo "::error::No codesigning identity found in the keychain — is IOS_SIGNING_P12_BASE64 a certificate *with* its private key?" >&2
            exit 1
          fi
          echo "SIGNING_SHA=$(echo "$IDENTITY_LINE" | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "SIGNING_NAME=$(echo "$IDENTITY_LINE" | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_ENV"
          echo "Imported identity: $(echo "$IDENTITY_LINE" | sed -E 's/.*"(.*)".*/\1/')"

      - name: Re-sign with fastlane sigh
        id: sigh
        continue-on-error: true
        run: |
          set -euo pipefail
          cp unsigned.ipa signed.ipa
          fastlane sigh resign signed.ipa \
            --signing_identity "$SIGNING_NAME" \
            --provisioning_profile "$RUNNER_TEMP/profile.mobileprovision" \
            --keychain_path "$KEYCHAIN"

      - name: Re-sign manually with codesign
        if: steps.sigh.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "fastlane sigh failed; falling back to codesign."
          rm -rf work && mkdir work && cd work
          unzip -qq ../unsigned.ipa
          APP="$(find Payload -maxdepth 1 -name '*.app' | head -1)"

          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP/embedded.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' profile.plist > entitlements.plist

          # Nested code has to be signed before the bundle that contains it,
          # or the outer signature seals stale inner ones.
          find "$APP" \( -name '*.framework' -o -name '*.dylib' -o -name '*.appex' \) -print0 |
            while IFS= read -r -d '' nested; do
              echo "  signing $(basename "$nested")"
              codesign -f -s "$SIGNING_SHA" --keychain "$KEYCHAIN" --timestamp=none "$nested"
            done

          codesign -f -s "$SIGNING_SHA" --keychain "$KEYCHAIN" --timestamp=none \
            --entitlements entitlements.plist "$APP"

          rm -f ../signed.ipa
          zip -qry ../signed.ipa Payload

      - name: Verify the signature and read the app metadata
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify
          unzip -qq signed.ipa -d verify
          APP="$(find verify/Payload -maxdepth 1 -name '*.app' | head -1)"

          echo "--- codesign -dv --verbose=4 ---"
          codesign -dv --verbose=4 "$APP" 2>&1
          codesign --verify --no-strict "$APP" 2>&1 || {
            echo "::error::Signature verification failed." >&2
            exit 1
          }

          plist="$APP/Info.plist"
          {
            echo "APP_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
            echo "APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" 2>/dev/null || echo 1.0)"
            echo "APP_TITLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist" 2>/dev/null \
                              || /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")"
          } >> "$GITHUB_ENV"

      - name: Publish the signed IPA as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="signed-$(date -u +%Y%m%d-%H%M%S)"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" signed.ipa \
            --title "Signed $APP_TITLE $APP_VERSION" \
            --notes "Re-signed $APP_BUNDLE_ID for over-the-air install. Only devices in the provisioning profile can install it."
          # installd fetches this itself, unauthenticated, so it has to be the
          # public asset URL rather than an API one.
          echo "ASSET_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/signed.ipa" >> "$GITHUB_ENV"

      - name: Publish the OTA manifest to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/manifest.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>${ASSET_URL}</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>${APP_BUNDLE_ID}</string>
                  <key>bundle-version</key><string>${APP_VERSION}</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>${APP_TITLE}</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          PAGES_DIR="$RUNNER_TEMP/pages"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch gh-pages "$REMOTE" "$PAGES_DIR" 2>/dev/null; then
            echo "Updating the existing gh-pages branch."
          else
            echo "Creating the gh-pages branch."
            git clone --depth 1 "$REMOTE" "$PAGES_DIR"
            git -C "$PAGES_DIR" checkout --orphan gh-pages
            git -C "$PAGES_DIR" rm -rqf . >/dev/null 2>&1 || true
          fi

          cp "$RUNNER_TEMP/manifest.plist" "$PAGES_DIR/manifest.plist"
          git -C "$PAGES_DIR" config user.name  "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PAGES_DIR" add manifest.plist
          git -C "$PAGES_DIR" commit -qm "Manifest for ${RELEASE_TAG}"
          git -C "$PAGES_DIR" push -q origin gh-pages

          OWNER="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          echo "MANIFEST_URL=https://${OWNER}.github.io/${GITHUB_REPOSITORY##*/}/manifest.plist" >> "$GITHUB_ENV"

      - name: Summarise
        run: |
          {
            echo "## $APP_TITLE $APP_VERSION signed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Bundle id | \`$APP_BUNDLE_ID\` |"
            echo "| Identity | $SIGNING_NAME |"
            echo "| Release | \`$RELEASE_TAG\` |"
            echo
            echo "### Install over the air"
            echo
            echo "Open this in **Safari** on a device registered in the provisioning profile:"
            echo
            echo '```'
            echo "itms-services://?action=download-manifest&url=${MANIFEST_URL}"
            echo '```'
            echo
            echo "If nothing happens, GitHub Pages is not serving \`${MANIFEST_URL}\` yet —"
            echo "enable Pages for this repo with the \`gh-pages\` branch as its source."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" || true
