name: Sign IPA

# Re-signs an .ipa and publishes it for over-the-air install, so a device can
# be provisioned with no Mac, Xcode or iTunes anywhere in the loop.
#
# The App Store Connect API key this repo already holds for TestFlight issues
# the certificate and profiles, and codesign does the signing. The one secret
# of its own is IOS_P12_PASSWORD, which protects the .p12 published for the
# device; set IOS_SIGNING_P12_BASE64 as well to reuse a fixed certificate
# instead of issuing one per run.
#
# Two dead ends are worth recording. Xcode's cloud signing — the mechanism the
# TestFlight workflow uses — refuses to authenticate against a synthetic
# archive, failing with a bare "Authentication failed" per target for both
# development and ad-hoc methods. And issuing a certificate per run hits
# Apple's cap, because a fresh runner can never reuse an existing one; the
# private key died with the machine that made it. Hence the prune step, which
# keeps one certificate so the previous run's stays valid on the device.
#
# The one thing no API can discover is a phone's UDID, so a device has to be
# registered once — pass it as the `udid` input and this workflow registers it.
#
# Installs only work on devices in the profile: that is the usual reason an
# over-the-air install fails silently.

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct download URL of the IPA to sign (blank = app.ipa from the repo root)'
        required: false
        type: string
      bundle_id:
        description: 'Bundle id to sign under (blank = com.<owner>.<app name>)'
        required: false
        type: string
      udid:
        description: 'Device UDID to register first (blank = use devices already on the account)'
        required: false
        type: string

permissions:
  contents: write

# macOS runners bill at 10x, so never let two of these pile up.
concurrency:
  group: sign-ipa
  cancel-in-progress: false

jobs:
  sign:
    name: Sign and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          if [ -n "$IPA_URL" ]; then
            echo "Downloading the IPA to sign..."
            curl -fsSL --retry 3 --retry-delay 2 -o unsigned.ipa "$IPA_URL"
          elif [ -f app.ipa ]; then
            cp app.ipa unsigned.ipa
          else
            echo "::error::No ipa_url given and no app.ipa in the repo root." >&2
            exit 1
          fi
          # A wrong URL usually yields an HTML error page; catch that here
          # rather than in the middle of codesign.
          if ! unzip -l unsigned.ipa | grep -q 'Payload/'; then
            echo "::error::Downloaded file is not an IPA (no Payload/ directory)." >&2
            exit 1
          fi
          echo "IPA size: $(du -h unsigned.ipa | cut -f1)"

      - name: Decide the bundle identifier
        env:
          BUNDLE_ID_INPUT: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          rm -rf rebundle && mkdir rebundle && cd rebundle
          unzip -qq ../unsigned.ipa
          APP="$(find Payload -maxdepth 1 -name '*.app' | head -1)"
          ORIGINAL="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"

          if [ -n "$BUNDLE_ID_INPUT" ]; then
            BUNDLE_ID="$BUNDLE_ID_INPUT"
          else
            # Bundle ids are globally unique across all of Apple's developers,
            # so the original almost certainly belongs to whoever built the app
            # and cannot be registered here. Derive one in the account's own
            # namespace instead — the same thing Sideloadly does.
            SLUG="$(basename "$APP" .app | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')"
            BUNDLE_ID="com.${GITHUB_REPOSITORY_OWNER}.${SLUG}"
          fi
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "Signing $ORIGINAL as $BUNDLE_ID"

          # App extensions carry their own bundle ids, and Apple requires each
          # to stay prefixed by its parent's. Renaming only the app leaves the
          # extensions on the original developer's ids, which cannot be
          # registered here — export then fails asking for profiles for
          # com.kdt.livecontainer.LaunchAppExtension and friends.
          IDS="$BUNDLE_ID"
          if [ -d "$APP/PlugIns" ]; then
            for ext in "$APP"/PlugIns/*.appex; do
              [ -d "$ext" ] || continue
              ext_old="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ext/Info.plist")"
              ext_new="${BUNDLE_ID}${ext_old#"$ORIGINAL"}"
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $ext_new" "$ext/Info.plist"
              echo "  extension $ext_old -> $ext_new"
              IDS="$IDS $ext_new"
            done
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          rm -f ../unsigned.ipa
          zip -qry ../unsigned.ipa Payload
          echo "ALL_BUNDLE_IDS=$IDS" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for required in KEY_ID ISSUER_ID PRIVATE_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Secret for APPSTORE_$required is empty or unset." >&2
              exit 1
            fi
          done
          # jq escapes the PEM's newlines properly; hand-rolled JSON does not.
          jq -n --arg key_id "$KEY_ID" --arg issuer_id "$ISSUER_ID" --arg key "$PRIVATE_KEY" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > "$RUNNER_TEMP/asc_key.json"
          chmod 600 "$RUNNER_TEMP/asc_key.json"

      - name: Register the device
        if: ${{ inputs.udid != '' }}
        env:
          UDID: ${{ inputs.udid }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Already-registered UDIDs make this fail; that is not a problem.
          fastlane run register_device \
            udid:"$UDID" \
            name:"ota-$(date -u +%Y%m%d)" \
            team_id:"$TEAM_ID" \
            api_key_path:"$RUNNER_TEMP/asc_key.json" || \
            echo "Device registration reported an error (usually: already registered) — continuing."

      - name: Register the App ID
        run: |
          set -euo pipefail
          # -allowProvisioningUpdates can register bundle ids itself, but doing
          # it up front removes one thing the export can fail on. Idempotent.
          for id in $ALL_BUNDLE_IDS; do
            ASC_KEY_JSON="$RUNNER_TEMP/asc_key.json" BUNDLE_ID="$id" \
              ruby scripts/asc-register-bundle-id.rb
          done

      - name: Create a temporary keychain
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Disable the inactivity lock that would otherwise re-lock the
          # keychain mid-job and fail codesign.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Issue a certificate and one profile per bundle id
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          STORED_P12: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
        run: |
          set -euo pipefail
          export FASTLANE_SKIP_UPDATE_CHECK=1
          export FASTLANE_HIDE_CHANGELOG=1
          mkdir -p "$RUNNER_TEMP/certs"

          if [ -z "${P12_PASSWORD:-}" ]; then
            echo "::error::IOS_P12_PASSWORD is not set. It protects the .p12 this run publishes, which carries the signing private key." >&2
            exit 1
          fi

          if [ -n "${STORED_P12:-}" ]; then
            # A stored certificate is the stable choice: nothing is created,
            # nothing is revoked, and the .p12 already on the device stays
            # valid indefinitely.
            echo "Using the stored signing certificate."
            printf '%s' "$STORED_P12" | base64 --decode > "$RUNNER_TEMP/certs/signing.p12"
          else
            # Otherwise mint one. A runner can never reuse an existing
            # certificate — the private key died with the machine that made it
            # — and Apple caps how many may exist, so make room first. Keeping
            # one leaves the previous run's certificate valid, which matters
            # when it has been imported into an app on the device. Only
            # development certificates are touched; distribution certificates,
            # which App Store builds are signed with, are left alone.
            ASC_KEY_JSON="$RUNNER_TEMP/asc_key.json" \
              ruby scripts/asc-prune-dev-certificates.rb 1

            ASC_KEY_JSON="$RUNNER_TEMP/asc_key.json" \
              OUT_DIR="$RUNNER_TEMP/certs" \
              CERT_COMMON_NAME="$BUNDLE_ID signing" \
              ruby scripts/asc-create-certificate.rb

            # The .p12 is built here rather than by fastlane so its password is
            # one we control — the same file is handed to the device, and an
            # app importing it has to be told the password.
            openssl x509 -inform DER -in "$RUNNER_TEMP/certs/cert.cer" \
              -out "$RUNNER_TEMP/certs/cert.pem"
            openssl pkcs12 -export \
              -inkey "$RUNNER_TEMP/certs/key.pem" \
              -in "$RUNNER_TEMP/certs/cert.pem" \
              -out "$RUNNER_TEMP/certs/signing.p12" \
              -name "$BUNDLE_ID" \
              -passout env:P12_PASSWORD
            # The unencrypted key must not outlive this step.
            rm -f "$RUNNER_TEMP/certs/key.pem"
          fi

          security import "$RUNNER_TEMP/certs/signing.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          # Without this, codesign blocks on a UI prompt no headless runner
          # can answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null 2>&1

          # Every bundle in the app needs its own profile: the app and each of
          # its extensions sign against their own App ID.
          mkdir -p "$RUNNER_TEMP/profiles"
          for id in $ALL_BUNDLE_IDS; do
            fastlane sigh \
              --development \
              --api_key_path "$RUNNER_TEMP/asc_key.json" \
              --team_id "$TEAM_ID" \
              --app_identifier "$id" \
              --output_path "$RUNNER_TEMP/profiles" \
              --filename "${id}.mobileprovision" \
              --force
          done

          PROFILE="$RUNNER_TEMP/profiles/${BUNDLE_ID}.mobileprovision"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          DEVICES="$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" 2>/dev/null | grep -c '^ ' || true)"
          echo "Devices in the profile: $DEVICES"
          if [ "$DEVICES" -eq 0 ]; then
            echo "::error::The profile contains no devices. Re-run with the udid input set." >&2
            exit 1
          fi

          IDENTITY_LINE="$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1)"
          echo "SIGNING_SHA=$(echo "$IDENTITY_LINE" | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "SIGNING_NAME=$(echo "$IDENTITY_LINE" | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_ENV"
          echo "Signing identity: $(echo "$IDENTITY_LINE" | sed -E 's/.*"(.*)".*/\1/')"

      - name: Sign
        run: |
          set -euo pipefail
          rm -rf work && mkdir work && cd work
          unzip -qq ../unsigned.ipa
          APP="$(find Payload -maxdepth 1 -name '*.app' | head -1)"

          entitlements_for() {
            security cms -D -i "$1" > "$RUNNER_TEMP/p.plist"
            /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/p.plist" > "$2"
          }

          # Nested code first, the bundle containing it last, or the outer
          # signature seals stale inner ones. Frameworks carry no entitlements.
          if [ -d "$APP/Frameworks" ]; then
            for lib in "$APP"/Frameworks/*; do
              [ -e "$lib" ] || continue
              echo "  signing $(basename "$lib")"
              codesign -f -s "$SIGNING_SHA" --keychain "$KEYCHAIN" --timestamp=none "$lib"
            done
          fi

          # Each extension signs against its own App ID, so it gets its own
          # profile and entitlements.
          if [ -d "$APP/PlugIns" ]; then
            for ext in "$APP"/PlugIns/*.appex; do
              [ -d "$ext" ] || continue
              ext_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ext/Info.plist")"
              ext_profile="$RUNNER_TEMP/profiles/${ext_id}.mobileprovision"
              cp "$ext_profile" "$ext/embedded.mobileprovision"
              entitlements_for "$ext_profile" "$RUNNER_TEMP/ext.entitlements"
              echo "  signing $(basename "$ext") as $ext_id"
              codesign -f -s "$SIGNING_SHA" --keychain "$KEYCHAIN" --timestamp=none \
                --entitlements "$RUNNER_TEMP/ext.entitlements" "$ext"
            done
          fi

          cp "$RUNNER_TEMP/profiles/${BUNDLE_ID}.mobileprovision" "$APP/embedded.mobileprovision"
          entitlements_for "$RUNNER_TEMP/profiles/${BUNDLE_ID}.mobileprovision" "$RUNNER_TEMP/app.entitlements"
          echo "  signing $(basename "$APP") as $BUNDLE_ID"
          codesign -f -s "$SIGNING_SHA" --keychain "$KEYCHAIN" --timestamp=none \
            --entitlements "$RUNNER_TEMP/app.entitlements" "$APP"

          rm -f ../signed.ipa
          zip -qry ../signed.ipa Payload

      - name: Upload the signing certificate
        uses: actions/upload-artifact@v4
        with:
          name: signing-certificate
          # The private key, encrypted under IOS_P12_PASSWORD. Artifacts need a
          # GitHub login to download, unlike the release below — but on a public
          # repository that means any logged-in user, so the password is what
          # actually protects it.
          path: ${{ runner.temp }}/certs/signing.p12
          retention-days: 7
          if-no-files-found: error

      - name: Verify the signature and read the app metadata
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify
          unzip -qq signed.ipa -d verify
          APP="$(find verify/Payload -maxdepth 1 -name '*.app' | head -1)"

          echo "--- codesign -dv --verbose=4 ---"
          codesign -dv --verbose=4 "$APP" 2>&1
          codesign --verify --no-strict "$APP" 2>&1 || {
            echo "::error::Signature verification failed." >&2
            exit 1
          }

          plist="$APP/Info.plist"
          {
            echo "APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" 2>/dev/null || echo 1.0)"
            echo "APP_TITLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist" 2>/dev/null \
                              || /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")"
          } >> "$GITHUB_ENV"

      - name: Publish the IPA and its install manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="signed-$(date -u +%Y%m%d-%H%M%S)"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # installd fetches both of these itself, unauthenticated, so they
          # have to be public release assets. Serving the manifest here rather
          # than from Pages keeps the whole thing to one publishing step.
          cat > manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>${BASE}/signed.ipa</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>${BUNDLE_ID}</string>
                  <key>bundle-version</key><string>${APP_VERSION}</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>${APP_TITLE}</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          gh release create "$TAG" signed.ipa manifest.plist \
            --title "Signed $APP_TITLE $APP_VERSION" \
            --notes "Re-signed as \`$BUNDLE_ID\` for over-the-air install. Only devices in the provisioning profile can install it. Delete this release once installed."

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "MANIFEST_URL=${BASE}/manifest.plist" >> "$GITHUB_ENV"

      - name: Summarise
        run: |
          {
            echo "## $APP_TITLE $APP_VERSION signed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Bundle id | \`$BUNDLE_ID\` |"
            echo "| Identity | $SIGNING_NAME |"
            echo "| Release | \`$RELEASE_TAG\` |"
            echo
            echo "### Install over the air"
            echo
            echo "Open this in **Safari** on a device registered in the profile:"
            echo
            echo '```'
            echo "itms-services://?action=download-manifest&url=${MANIFEST_URL}"
            echo '```'
            echo
            echo "Then trust the certificate: Settings → General → VPN & Device Management."
            echo
            echo "Delete the \`$RELEASE_TAG\` release once installed — the IPA is public while it exists."
            echo
            echo "The **signing-certificate** artifact on this run holds the .p12, encrypted"
            echo "with \`IOS_P12_PASSWORD\`. Apps that re-sign on device, such as LiveContainer"
            echo "in JITLess mode, need it imported."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/asc_key.json" "$RUNNER_TEMP/p.plist" || true
          rm -rf ~/private_keys "$RUNNER_TEMP/certs" "$RUNNER_TEMP/profiles" || true
