name: Release

# Publishes a GitHub Release marker for a version — no build artifacts, since
# TaskLock ships through the App Store, not GitHub downloads. Manual only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: TaskLock ${{ github.event.inputs.tag }}
          body: |
            ## TaskLock ${{ github.event.inputs.tag }} 🔒

            Lock distracting apps until your tasks are done — enforced with
            Apple's Screen Time framework, not a timer you can dismiss.

            TaskLock ships through the App Store. This tag marks the source
            corresponding to this release; see the App Store listing for the
            installable app.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
