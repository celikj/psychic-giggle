name: Release

# Build TaskLock desktop executables and publish them to a GitHub Release.
# Triggered by pushing a tag like v1.0.0, or manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node18-linux-x64
            asset: tasklock-linux-x64
          - os: macos-13
            target: node18-macos-x64
            asset: tasklock-macos-x64
          - os: macos-latest
            target: node18-macos-arm64
            asset: tasklock-macos-arm64
          - os: windows-latest
            target: node18-win-x64
            asset: tasklock-win-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build single-file web bundle
        run: npm run build:single

      - name: Embed bundle into launcher
        run: npm run embed

      - name: Build executable
        run: npx pkg launcher/server.cjs --targets ${{ matrix.target }} --output "dist-bin/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist-bin/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build standalone HTML (no-install version)
        run: |
          npm run build:single
          cp dist-single/index.html TaskLock.html

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets artifacts
          find artifacts -type f -exec cp {} release-assets/ \; || true
          cp TaskLock.html release-assets/
          chmod +x release-assets/tasklock-linux-* release-assets/tasklock-macos-* 2>/dev/null || true
          ls -la release-assets

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: TaskLock ${{ steps.tag.outputs.tag }}
          body: |
            ## TaskLock ${{ steps.tag.outputs.tag }} 🔒

            Lock distracting apps until your tasks are done. Tasks, habits, and an app blocker — all in one.

            ### Downloads

            | Platform | File |
            |----------|------|
            | 🪟 Windows (x64) | `tasklock-win-x64.exe` |
            | 🍎 macOS (Apple Silicon) | `tasklock-macos-arm64` |
            | 🍎 macOS (Intel) | `tasklock-macos-x64` |
            | 🐧 Linux (x64) | `tasklock-linux-x64` |
            | 🌐 Any (browser) | `TaskLock.html` — double-click to open, no install |

            ### Running it
            - **Desktop binary:** download, then run it. It starts a local server and opens TaskLock in your browser. On macOS/Linux you may need `chmod +x tasklock-*` first.
            - **TaskLock.html:** just double-click — the entire app is self-contained in one file.

            All data is stored locally in your browser. Nothing is uploaded.
          files: release-assets/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
